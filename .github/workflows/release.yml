name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Rename binary
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv target/release/rusty_file_search.exe target/release/rusty_file_search-windows.exe
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            mv target/release/rusty_file_search target/release/rusty_file_search-macos
          else
            mv target/release/rusty_file_search target/release/rusty_file_search-linux
          fi
      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/rusty_file_search-*